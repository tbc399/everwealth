{% from "partials/ui.html" import icon %}
<dialog id="transaction-upload-file-modal" class="modal" data-modal aria-labelledby="import-heading">
  <div class="modal-box max-w-lg">
    <div class="flex items-center justify-between gap-3">
      <h2 id="import-heading" class="text-lg font-semibold">Import transactions</h2>
      <button type="button" class="btn btn-ghost btn-square btn-sm" data-close-modal aria-label="Close">{{ icon("x") }}</button>
    </div>
    <form method="post" action="/transactions/upload" enctype="multipart/form-data" class="mt-5 space-y-4">
      <label class="form-control">
        <span class="label-text mb-2">Account</span>
        <select name="account" required class="select select-bordered w-full" autofocus>
          <option value="">Select an account</option>
          {% for account in accounts %}<option value="{{ account.id }}">{{ account.name }}</option>{% endfor %}
        </select>
      </label>
      <label class="form-control">
        <span class="label-text mb-2">CSV file</span>
        <input name="file" type="file" required accept=".csv,text/csv" class="file-input file-input-bordered file-input-primary w-full">
      </label>
      <a href="{{ url_for('static', path='/upload_template.csv') }}" download class="link link-primary inline-flex items-center gap-2 text-sm">{{ icon("download") }} CSV template</a>
      <div class="modal-action">
        <button type="button" class="btn btn-ghost btn-sm" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm">{{ icon("file-spreadsheet") }} Import</button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop"><button>Close</button></form>
</dialog>
