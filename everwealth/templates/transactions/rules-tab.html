<section id="transactions-tab-list" class="card card-border bg-base-100 shadow-xs" aria-labelledby="rules-heading">
  <div class="border-b border-base-300 px-5 py-4"><h2 id="rules-heading" class="section-heading">Transaction rules</h2></div>
  {% if rules %}
    <ul class="divide-y divide-base-300">
      {% for rule in rules %}<li class="px-5 py-4 text-sm">{{ rule.id }}</li>{% endfor %}
    </ul>
  {% else %}
    <div class="empty-state">No transaction rules.</div>
  {% endif %}
</section>
