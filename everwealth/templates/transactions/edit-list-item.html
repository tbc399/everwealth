<form
  id="tran_{{ transaction.id }}"
  hx-put="/transactions/{{ transaction.id }}"
  hx-target="#tran_{{ transaction.id }}"
  hx-swap="outerHTML"
  class="transaction-row is-editing block px-4 py-3 md:table-row md:p-0 bg-slate-950/55 ring-1 ring-inset ring-slate-800">
  <div class="grid gap-3 md:table-cell md:w-32 md:px-4 md:py-3 md:align-top">
    <label class="text-xs font-semibold uppercase text-slate-600 md:hidden" for="transaction-date-{{ transaction.id }}">Date</label>
    <input
      id="transaction-date-{{ transaction.id }}"
      type="date"
      name="date"
      value="{{ transaction.date }}"
      class="w-full rounded-md border border-slate-800 bg-slate-900 px-2 py-1.5 text-xs text-slate-300 focus:border-slate-700 focus:outline-none focus:ring-0">
  </div>

  <div class="grid gap-2 md:table-cell md:px-4 md:py-3 md:align-top">
    <label class="text-xs font-semibold uppercase text-slate-600" for="transaction-description-{{ transaction.id }}">Description</label>
    <input
      id="transaction-description-{{ transaction.id }}"
      type="text"
      name="description"
      value="{{ transaction.description }}"
      class="w-full rounded-md border border-slate-800 bg-slate-900 px-2 py-1.5 text-sm font-semibold text-slate-100 placeholder-slate-600 focus:border-slate-700 focus:outline-none focus:ring-0"
      placeholder="Transaction description">
    {% if transaction.orig_description and transaction.orig_description != transaction.description %}
    <div class="truncate text-xs text-slate-600">Original: {{ transaction.orig_description }}</div>
    {% endif %}
    <textarea
      name="notes"
      class="min-h-16 w-full resize-y rounded-md border border-slate-800 bg-slate-900 px-2 py-1.5 text-xs text-slate-400 placeholder-slate-600 focus:border-slate-700 focus:outline-none focus:ring-0"
      placeholder="Notes">{{ transaction.notes or "" }}</textarea>
  </div>

  <div class="grid gap-3 md:table-cell md:w-40 md:px-4 md:py-3 md:align-top">
    <label class="text-xs font-semibold uppercase text-slate-600" for="transaction-category-{{ transaction.id }}">Category</label>
    <select
      id="transaction-category-{{ transaction.id }}"
      name="category"
      class="w-full rounded-md border border-slate-800 bg-slate-900 px-2 py-1.5 text-xs text-slate-300 focus:border-slate-700 focus:outline-none focus:ring-0">
      <option value="">Uncategorized</option>
      {% set selected_category_id = transaction.category_id %}
      {% include "budgets/category-options.html" %}
    </select>
    <label class="flex items-center gap-2 text-xs text-slate-500">
      <input
        type="checkbox"
        name="hidden"
        value="true"
        {% if transaction.hidden %}checked{% endif %}
        class="rounded border-slate-700 bg-slate-900 text-teal-700 focus:ring-0">
      Hidden
    </label>
  </div>

  <div class="grid gap-3 md:table-cell md:w-28 md:px-4 md:py-3 md:text-right md:align-top">
    <div class="text-sm font-semibold tabular-nums {% if transaction.amount > 0 %}text-teal-200{% else %}text-slate-200{% endif %}">
      {% if transaction.amount > 0 %}
        +${{ transaction.display_amount }}
      {% else %}
        ${{ transaction.display_amount }}
      {% endif %}
    </div>
    <div class="flex justify-end gap-2">
      <button
        type="button"
        hx-get="/transactions/{{ transaction.id }}/row"
        hx-target="#tran_{{ transaction.id }}"
        hx-swap="outerHTML"
        class="rounded-md px-2 py-1 text-xs font-semibold text-slate-500 hover:bg-slate-800/70 hover:text-slate-300">
        Cancel
      </button>
      <button
        type="submit"
        class="rounded-md bg-teal-800 px-2.5 py-1 text-xs font-semibold text-slate-100 hover:bg-teal-700">
        Save
      </button>
    </div>
  </div>
</form>
