{% from "partials/ui.html" import icon %}
<tr id="tran_{{ transaction.id }}" class="hover">
  <td class="hidden whitespace-nowrap text-base-content/60 md:table-cell">{{ transaction.date.strftime("%b %d, %Y") }}</td>
  <td class="max-w-48">
    <button type="button" class="link link-hover break-words text-left" hx-get="/transactions/{{ transaction.id }}/edit" hx-target="#tran_{{ transaction.id }}" hx-swap="outerHTML" data-edit-transaction>{{ transaction.description }}</button>
    <div class="mt-1 text-xs text-base-content/60 md:hidden">{{ transaction.date.strftime("%b %d") }} &middot; {{ transaction.category_name or "Uncategorized" }}</div>
  </td>
  <td class="hidden min-w-40 md:table-cell">
    <select name="category" aria-label="Category for {{ transaction.description }}" hx-patch="/transactions/{{ transaction.id }}/category" hx-trigger="change" hx-target="#tran_{{ transaction.id }}" hx-swap="outerHTML" class="select select-ghost select-xs w-full max-w-48 font-normal">
      <option value="">Uncategorized</option>
      {% set selected_category_id = transaction.category_id %}
      {% include "budgets/category-options.html" %}
    </select>
  </td>
  <td class="whitespace-nowrap text-right font-mono text-sm {{ 'text-success' if transaction.amount > 0 else '' }}">{% if transaction.amount > 0 %}+{% else %}&minus;{% endif %}${{ transaction.display_amount }}</td>
  <td class="text-right">
    <button type="button" class="btn btn-ghost btn-square btn-xs" hx-get="/transactions/{{ transaction.id }}/edit" hx-target="#tran_{{ transaction.id }}" hx-swap="outerHTML" data-edit-transaction aria-label="Edit {{ transaction.description }}" title="Edit transaction">{{ icon("pencil") }}</button>
  </td>
</tr>
