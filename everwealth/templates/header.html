<head>
  <title>{{ title or "Everwealth" }}</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (() => {
      const root = document.documentElement;
      const { lightTheme, darkTheme } = root.dataset;
      let storedTheme;
      try { storedTheme = localStorage.getItem("theme"); } catch {}
      const theme = storedTheme === "winter" ? lightTheme
        : storedTheme === "dim" ? darkTheme : storedTheme;
      root.dataset.theme = [lightTheme, darkTheme].includes(theme)
        ? theme : (matchMedia("(prefers-color-scheme: dark)").matches ? darkTheme : lightTheme);
      if (theme !== storedTheme) {
        try { localStorage.setItem("theme", theme); } catch {}
      }
    })();
  </script>
  <link href="{{ url_for('static', path='/styles.css') }}" rel="stylesheet">
  <script src="{{ url_for('static', path='/scripts/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='/scripts/app.js') }}" defer></script>
</head>
