<section id="accounts-tab-list" class="card card-bordered bg-base-100 shadow-sm" aria-labelledby="assets-heading">
  <div class="border-b border-base-300 px-5 py-4">
    <h2 id="assets-heading" class="section-heading">Assets</h2>
    <p class="muted">{{ assets|length }} tracked</p>
  </div>
  <div class="overflow-x-auto">
    <table class="table table-zebra">
      <thead><tr><th>Name</th><th>Type</th><th>Last updated</th></tr></thead>
      <tbody>
        {% for asset in assets %}
          <tr><td class="font-medium">{{ asset.name }}</td><td><span class="badge badge-ghost badge-sm">{{ asset.type|capitalize }}</span></td><td class="text-base-content/60">{{ asset.updated_at.strftime("%b %d, %Y") }}</td></tr>
        {% else %}
          <tr><td colspan="3" class="empty-state">No assets tracked.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
