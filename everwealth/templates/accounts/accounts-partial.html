{% from "partials/ui.html" import icon, page_header %}
{% call page_header("Accounts") %}
  <a href="#account-name" class="btn btn-primary btn-sm">{{ icon("plus") }} Add account</a>
{% endcall %}
<div role="tablist" class="tabs tabs-border w-fit" aria-label="Account views">
  <a role="tab" href="/accounts" hx-get="/accounts/partial" hx-target="#main-content" hx-push-url="/accounts" class="tab {{ 'tab-active' if tab == 'accounts' }}" aria-selected="{{ 'true' if tab == 'accounts' else 'false' }}">Accounts</a>
  <a role="tab" href="/accounts/assets" hx-get="/accounts/assets/partial" hx-target="#main-content" hx-push-url="/accounts/assets" class="tab {{ 'tab-active' if tab == 'assets' }}" aria-selected="{{ 'true' if tab == 'assets' else 'false' }}">Assets</a>
</div>
{% include partial %}
