{% from "partials/ui.html" import icon %}
<dialog id="budget-create-modal" class="modal" data-modal aria-labelledby="create-budget-heading">
  <div class="modal-box max-w-lg">
    <div class="flex items-center justify-between gap-3">
      <h2 id="create-budget-heading" class="text-lg font-semibold">New budget</h2>
      <button type="button" class="btn btn-ghost btn-square btn-sm" data-close-modal aria-label="Close">{{ icon("x") }}</button>
    </div>
    <form action="/budgets" method="post" class="mt-5 space-y-4">
      <label class="form-control">
        <span class="label-text mb-2">Category</span>
        <select name="category" class="select select-bordered w-full" required autofocus>
          <option value="" disabled selected>Select a category</option>
          {% set selected_category_id = none %}
          {% include "budgets/category-options.html" %}
        </select>
      </label>
      <div class="form-control">
        <label for="new-budget-amount" class="label-text mb-2">Monthly amount</label>
        <div class="input input-bordered flex items-center gap-2">
          <span class="text-base-content/50">$</span>
          <input id="new-budget-amount" type="number" name="amount" min="0" step="1" required placeholder="0" class="min-w-0 grow">
        </div>
      </div>
      <label class="label cursor-pointer justify-start gap-3">
        <input type="checkbox" name="rollover" value="true" class="checkbox checkbox-sm">
        <span class="label-text">Copy this budget into future months</span>
      </label>
      <div class="modal-action">
        <button type="button" class="btn btn-ghost btn-sm" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm">{{ icon("plus") }} Create budget</button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop"><button>Close</button></form>
</dialog>
