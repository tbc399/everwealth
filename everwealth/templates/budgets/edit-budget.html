{% from "partials/ui.html" import icon %}
<dialog id="budget-detail" class="modal" data-modal aria-labelledby="edit-budget-heading">
  <div class="modal-box max-w-lg">
    <div class="flex items-center justify-between gap-3">
      <h2 id="edit-budget-heading" class="text-lg font-semibold">{{ budget.category_name }}</h2>
      <button type="button" class="btn btn-ghost btn-square btn-sm" data-close-modal aria-label="Close">{{ icon("x") }}</button>
    </div>
    <form hx-put="/budgets/{{ budget.id }}" class="mt-5 space-y-4">
      <div class="form-control">
        <label for="edit-budget-amount" class="label-text mb-2">Monthly amount</label>
        <div class="input input-bordered flex items-center gap-2">
          <span class="text-base-content/50">$</span>
          <input id="edit-budget-amount" name="amount" type="number" min="0" step="1" value="{{ budget.amount }}" required autofocus class="min-w-0 grow">
        </div>
      </div>
      <label class="label cursor-pointer justify-start gap-3">
        <input name="rollover" type="checkbox" value="true" class="checkbox checkbox-sm" {% if budget.rollover %}checked{% endif %}>
        <span class="label-text">Copy this budget into future months</span>
      </label>
      <div class="modal-action justify-between">
        <button type="button" hx-delete="/budgets/{{ budget.id }}" hx-confirm="Delete this budget?" class="btn btn-error btn-outline btn-sm">{{ icon("trash-2") }} Delete</button>
        <button type="submit" class="btn btn-primary btn-sm">{{ icon("check") }} Save changes</button>
      </div>
    </form>
    {% if transactions %}
      <div class="divider"></div>
      <h3 class="section-heading mb-3">Transactions this month</h3>
      <ul class="divide-y divide-base-300">
        {% for transaction in transactions %}
          <li class="flex items-center justify-between gap-4 py-2 text-sm">
            <span class="min-w-0 break-words">{{ transaction.description }}</span>
            <span class="shrink-0 font-mono">${{ transaction.display_amount }}</span>
          </li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
  <form method="dialog" class="modal-backdrop"><button>Close</button></form>
</dialog>
