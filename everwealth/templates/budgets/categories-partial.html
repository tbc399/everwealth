<section id="main-content" class="ew-page" {% if request.headers.get("HX-Request") %}hx-swap-oob="outerHTML:#main-content"{% endif %}>
  <header class="ew-page-header">
    <h1>Categories</h1>
  </header>

  <div class="ew-budget-actions">
    <button class="ew-text-button" hx-get="/budgets/partial" hx-push-url="/budgets" hx-target="#main-content">
      Budgets
    </button>
    <form class="ml-auto flex flex-wrap items-center gap-2" action="/categories" method="post">
      <input
        type="text"
        name="name"
        class="min-w-0 rounded-md border border-slate-800 bg-slate-950 px-3 py-1.5 text-sm text-slate-300 placeholder-slate-600 focus:border-slate-700 focus:outline-none focus:ring-0"
        required
        placeholder="Add new category">
      <button type="submit" class="ew-primary-button">
        <span>+</span> Add
      </button>
    </form>
  </div>

  <div class="mt-4 grid grid-cols-1 gap-3 md:grid-cols-2">
    {% for group in category_groups %}
    <section class="rounded-md border border-slate-800 bg-slate-950/40 p-3">
      <div class="flex items-center justify-between gap-3">
        <span class="min-w-0 truncate text-sm font-semibold text-slate-200">{{ group.parent.name }}</span>
        <span class="shrink-0 text-xs uppercase text-slate-600">{{ group.parent.type }}</span>
      </div>

      {% if group.children %}
      <ul class="mt-3 flex flex-wrap gap-2">
        {% for category in group.children %}
        <li class="max-w-full rounded bg-slate-900 px-2 py-1 text-xs text-slate-400">
          {{ category.name }}
        </li>
        {% endfor %}
      </ul>
      {% else %}
      <div class="mt-3 text-xs text-slate-600">No subcategories</div>
      {% endif %}
    </section>
    {% else %}
    <div class="text-sm text-slate-500">No categories yet.</div>
    {% endfor %}
  </div>
</section>
