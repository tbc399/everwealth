{% extends "auth/layout.html" %}
{% set title = "Verify sign-in | Everwealth" %}
{% block auth_content %}
  <h1 class="text-xl font-semibold">Verify your sign-in</h1>
  <form action="/login/validate/{{ otp.magic_token }}" method="post" class="mt-5 space-y-5" data-otp>
    <fieldset>
      <legend class="fieldset-legend">One-time passcode</legend>
      <div class="flex gap-3">
        {% for digit in range(1, 5) %}
          <input name="digit_{{ digit }}" type="text" inputmode="numeric" pattern="[0-9]" maxlength="4" required aria-label="Digit {{ digit }}" autocomplete="{{ 'one-time-code' if digit == 1 else 'off' }}" class="input min-w-0 w-14 text-center text-xl" {% if digit == 1 %}autofocus{% endif %}>
        {% endfor %}
      </div>
    </fieldset>
    <button type="submit" class="btn btn-primary w-full">Verify {{ icon("check") }}</button>
  </form>
{% endblock %}
