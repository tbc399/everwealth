{% extends "base.html" %}
{% from "partials/ui.html" import icon, wordmark %}
{% block body %}
  <main class="auth-shell">
    <div class="auth-header">
      {{ wordmark('/') }}
      <label class="label whitespace-normal cursor-pointer gap-2">
        {{ icon("moon") }}
        <input type="checkbox" class="toggle toggle-sm" data-theme-toggle aria-label="Dark theme">
      </label>
    </div>
    <section class="card card-border bg-base-100">
      <div class="card-body block p-6 sm:p-8">
        {% block auth_content %}{% endblock %}
      </div>
    </section>
    <nav class="auth-legal" aria-label="Legal information">
      <a href="/privacy">Privacy policy</a>
      <a href="/terms">Terms of use</a>
      <a href="/cookies">Cookies &amp; storage</a>
    </nav>
  </main>
{% endblock %}
