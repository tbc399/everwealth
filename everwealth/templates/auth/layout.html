{% extends "base.html" %}
{% from "partials/ui.html" import icon %}
{% block body %}
  <main class="mx-auto w-full max-w-md px-4 py-12 sm:py-20">
    <div class="mb-6 flex items-center justify-between gap-4">
      <a href="/login" class="text-xl font-semibold">Everwealth</a>
      <label class="label cursor-pointer gap-2">
        {{ icon("moon") }}
        <input type="checkbox" class="toggle toggle-sm" data-theme-toggle aria-label="Dark theme">
      </label>
    </div>
    <section class="card card-bordered bg-base-100 shadow-sm">
      <div class="card-body block p-6 sm:p-8">
        {% block auth_content %}{% endblock %}
      </div>
    </section>
  </main>
{% endblock %}
