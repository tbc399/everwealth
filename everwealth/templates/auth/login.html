{% extends "auth/layout.html" %}
{% set title = "Sign in | Everwealth" %}
{% block auth_content %}
  <h1 class="text-xl font-semibold">Sign in</h1>
  {% if error %}<div class="alert alert-error mt-4 text-sm" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="mt-5 space-y-4">
    <label class="grid gap-2 text-sm">
      <span class="label">Username or email</span>
      <input type="text" name="identifier" autocomplete="username" value="{{ identifier or '' }}" class="input w-full" required autofocus>
    </label>
    <label class="grid gap-2 text-sm">
      <span class="label">Password</span>
      <input type="password" name="password" autocomplete="current-password" class="input w-full" required>
    </label>
    <button type="submit" class="btn btn-primary w-full">Sign in {{ icon("arrow-right") }}</button>
  </form>
  <p class="muted mt-5">New to Everwealth? <a class="link link-primary" href="/register">Create an account</a></p>
{% endblock %}
